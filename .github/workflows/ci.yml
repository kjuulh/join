name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Test
        run: go test -race ./...

      - name: Test bench module
        run: go test -race ./...
        working-directory: bench

      - name: Vet
        run: go vet ./...
